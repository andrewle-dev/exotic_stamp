name: metro_stamp_app
description: Metro Stamp mobile application.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cached_network_image: ^3.4.1
  connectivity_plus: ^6.1.4
  cookie_jar: ^4.0.8
  device_info_plus: ^11.3.0
  dio: ^5.8.0+1
  dio_cookie_manager: ^3.2.0
  equatable: ^2.0.7
  flutter_bloc: ^9.1.1
  flutter_secure_storage: ^9.2.4
  font_awesome_flutter: ^10.8.0
  geolocator: ^13.0.2
  go_router: ^15.1.2
  image_picker: ^1.1.2
  mobile_scanner: ^7.2.0
  share_plus: ^10.1.4
  nfc_manager: ^4.1.1
  ndef_record: ^1.2.1
  path_provider: ^2.1.5
  shared_preferences: ^2.5.3
  pinput: ^5.0.1
  url_launcher: ^6.3.1
  uuid: ^4.5.1
  package_info_plus: ^9.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4
  mocktail: ^1.0.4
  bloc_test: ^10.0.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/logo/ExoticStamp_logo.png
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/logo/
    - assets/logo/ExoticStamp_logo.png
    - assets/stamps/
