spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/exotic_stamp}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:f123}

  jpa:
    hibernate:
      ddl-auto: validate
      # validate: check entity in code match the database? (recommend for prod)
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        default_schema: public

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # Empty default = local Redis without requirepass.
      password: ${REDIS_PASSWORD:change-me-only}
      timeout: 3s

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:admin@facewashfox.com.vn}
    password: ${MAIL_PASSWORD:uvbn oebx spwz kswj}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  # Flyway: if this database already had tables created by Hibernate (ddl-auto) and no
  # flyway_schema_history row yet, baseline-on-migrate creates the history table and
  # marks baseline at baseline-version, then applies pending migrations (e.g. V1 mail_jobs).
  # For production, prefer an explicit flyway baseline command instead of relying on this.
  flyway:
    baseline-on-migrate: true
    baseline-version: 0
    # After a failed migration or editing migration files, Flyway may need repair; dev-only.
    repair-on-migrate: true
    enabled: true

application:
  bootstrap:
    # Dev seed passwords (AdminSeedBootstrap / MvpDemoSeedBootstrap). Override via .env if needed.
    admin-password: ${ADMIN_SEED_PASSWORD:Admin@123456}
    demo-user-password: ${DEMO_USER_PASSWORD:Demo@123456}
  frontend:
    dev: http://localhost:3000
    prod: https://report.facewashfox.com

  backend:
    dev: http://localhost:8080
    prod: https://backend.facewashfox.com

  mail:
    # Must be a valid mailbox address; display name is handled by the mail provider/client.
    from: ${MAIL_FROM:admin@facewashfox.com.vn}
    display-name: ${MAIL_DISPLAY_NAME:Exotic Travelers}
    reply-to: ${MAIL_REPLY_TO:}
    list-unsubscribe: ${MAIL_LIST_UNSUBSCRIBE:}
    logo-url: ${MAIL_LOGO_URL:https://res.cloudinary.com/dnahocnhk/image/upload/f_png,b_white/v1762831622/fwf-logo_veozws.webp}
    queue:
      max-per-minute: 30
      batch-size: 10
      poll-interval-ms: 1000
      stuck-reset-interval-ms: 600000
      stuck-processing-threshold-minutes: 5

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

  security:
    token-revocation:
      fail-open-on-db-error: true
    rate-limit:
      backend: redis

jwt:
  # Local-only default: Base64 of 32+ bytes. Override with JWT_SECRET in .env for real use.
  secret: ${JWT_SECRET:ZXhvdGljU3RhbXBMb2NhbERldkp3dFNlY3JldEtleTMyYnl0ZXMh}

logging:
  level:
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG

gg:
  jte:
    developmentMode: true

springdoc:
  swagger-ui:
    try-it-out-enabled: true
    persist-authorization: true
    display-request-duration: true
    operations-sorter: method
    tags-sorter: alpha
