name: Backend CI

on:
  pull_request:
    branches:
      - main
      - master
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  push:
    branches:
      - main
      - master
      - 'chore/**'
      - 'release/**'
      - 'hotfix/**'
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Maven verify (CI profile)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Verify Docker daemon
        run: docker info

      - name: Maven clean verify (CI)
        run: mvn -B -ntp clean verify -Pci

      - name: Assert Surefire/Failsafe reports
        if: always()
        run: |
          mkdir -p artifacts/ci
          if [ -d target/failsafe-reports ] || [ -d target/surefire-reports ]; then
            python scripts/ci/assert_test_reports.py --strict | tee artifacts/ci/assert_test_reports.txt
          else
            echo "No Surefire/Failsafe reports found" | tee artifacts/ci/assert_test_reports.txt
            exit 1
          fi

      - name: JaCoCo critical package diagnostics
        if: always()
        run: |
          mkdir -p artifacts/ci
          if [ -f target/site/jacoco/jacoco.xml ]; then
            python scripts/ci/jacoco_critical_packages.py | tee artifacts/ci/jacoco_critical_packages.txt
            python scripts/ci/jacoco_summary.py | tee artifacts/ci/jacoco_summary.txt
          else
            echo "target/site/jacoco/jacoco.xml missing" | tee artifacts/ci/jacoco_summary.txt
            exit 1
          fi

      - name: Upload Surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/target/surefire-reports/
          if-no-files-found: warn

      - name: Upload Failsafe reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failsafe-reports
          path: backend/target/failsafe-reports/
          if-no-files-found: warn

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: |
            backend/target/site/jacoco/
            backend/target/jacoco.exec
          if-no-files-found: warn

      - name: Upload test assertion and coverage diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-diagnostics
          path: backend/artifacts/ci/
          if-no-files-found: warn

      - name: Upload packaged JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/ExoticStamp-*.jar
          if-no-files-found: error
