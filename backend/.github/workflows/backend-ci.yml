name: Backend CI

on:
  pull_request:
    branches:
      - main
      - master
  push:
    branches:
      # Remote evidence (exotic → EXOTIC_STAMP): HEAD is main.
      # Local history also uses master; keep both until remotes converge.
      - main
      - master
      # Quality / release engineering branches (Batch F.0)
      - 'chore/**'
      - 'release/**'
      - 'hotfix/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Maven verify (CI profile)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Verify Docker daemon
        run: docker info

      - name: Maven clean verify (CI)
        id: maven
        run: mvn -B -ntp clean verify -Pci

      - name: Assert Surefire/Failsafe reports
        id: assert_reports
        if: always()
        env:
          ci.require-docker: "true"
        run: |
          mkdir -p artifacts/ci
          if [ -d target/failsafe-reports ] || [ -d target/surefire-reports ]; then
            python scripts/ci/assert_test_reports.py --strict | tee artifacts/ci/assert_test_reports.txt
          else
            echo "No Surefire/Failsafe reports found" | tee artifacts/ci/assert_test_reports.txt
            exit 1
          fi

      - name: JaCoCo critical package diagnostics
        id: jacoco_diag
        if: always()
        run: |
          mkdir -p artifacts/ci
          if [ -f target/site/jacoco/jacoco.xml ]; then
            python scripts/ci/jacoco_critical_packages.py | tee artifacts/ci/jacoco_critical_packages.txt
            python scripts/ci/jacoco_summary.py | tee artifacts/ci/jacoco_summary.txt
          else
            echo "target/site/jacoco/jacoco.xml missing" | tee artifacts/ci/jacoco_summary.txt
            exit 1
          fi

      - name: Upload Surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: warn

      - name: Upload Failsafe reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failsafe-reports
          path: target/failsafe-reports/
          if-no-files-found: warn

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: |
            target/site/jacoco/
            target/jacoco.exec
          if-no-files-found: warn

      - name: Upload test assertion and coverage diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-diagnostics
          path: artifacts/ci/
          if-no-files-found: warn

      - name: Upload packaged JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: target/ExoticStamp-*.jar
          if-no-files-found: error
