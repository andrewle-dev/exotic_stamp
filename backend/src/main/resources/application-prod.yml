server:
  # Trust X-Forwarded-Proto / Host from reverse proxy (prod TLS termination).
  forward-headers-strategy: framework

spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD:}
      timeout: 3s

  mail:
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}

application:
  frontend:
    current: ${FRONTEND_URL}
  backend:
    current: ${BACKEND_URL}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

  auth:
    cookie:
      same-site: ${AUTH_COOKIE_SAME_SITE:Lax}
      secure-always: true
      path: /api/v1/auth
      domain: ${AUTH_COOKIE_DOMAIN:}

jwt:
  secret: ${JWT_SECRET}

logging:
  level:
    org.springframework.security: WARN
    org.springframework.web: INFO

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false