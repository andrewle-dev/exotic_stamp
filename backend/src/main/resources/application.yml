server:
  port: ${SERVER_PORT:8080}

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 3s

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}

  servlet:
    multipart:
      max-file-size: ${STORAGE_MULTIPART_MAX_FILE_SIZE:5MB}
      max-request-size: ${STORAGE_MULTIPART_MAX_REQUEST_SIZE:6MB}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

application:
  frontend:
    dev: http://localhost:3000
    prod: frontend url

  backend:
    prod: backend url

  rbac:
    admin-role-code: ADMIN
    protected-system-role-codes:
      - ADMIN
    max-role-code-length: 64
    max-permission-code-length: 80
    max-description-length: 500

  mail:
    from: ${MAIL_FROM}
    # Friendly sender name shown by mail clients next to the From address.
    display-name: ${MAIL_DISPLAY_NAME:Exotic Travelers}
    # Optional. Leave unset so replies go to the From inbox; set to a monitored mailbox if desired.
    reply-to: ${MAIL_REPLY_TO:}
    # Optional. Set only if marketing-adjacent mail is sent from this domain (one-click unsubscribe).
    list-unsubscribe: ${MAIL_LIST_UNSUBSCRIBE:}
    logo-url: https://res.cloudinary.com/dnahocnhk/image/upload/f_png,b_white/v1762831622/fwf-logo_veozws.webp
    queue:
      max-per-minute: 30
      batch-size: 10
      poll-interval-ms: 5000
      stuck-reset-interval-ms: 600000
      stuck-processing-threshold-minutes: 5

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
    allowed-methods: ${CORS_ALLOWED_METHODS:GET,POST,PUT,PATCH,DELETE,OPTIONS,HEAD}
    allowed-headers: ${CORS_ALLOWED_HEADERS:*}
    allow-credentials: ${CORS_ALLOW_CREDENTIALS:true}
    max-age-seconds: ${CORS_MAX_AGE_SECONDS:3600}

  security:
    token-revocation:
      fail-open-on-db-error: false

  auth:
    refresh-reuse-grace: 30s
    cookie:
      name: refresh_token
      path: /api/v1/auth
      domain:
      same-site: Lax
      # When false, Secure follows request.isSecure(); set secure-always in prod.
      secure: false
      secure-always: false
      http-only: true
    otp:
      length: 6
      forgot-password:
        ttl: 5m
        cooldown-ttl: 2m
        attempts-ttl: 1h
        max-attempts: 5
      email-verify:
        ttl: 10m
        cooldown-ttl: 2m
        attempts-ttl: 1h
        max-attempts: 5

jwt:
  secret: ${JWT_SECRET}
  access-token-ttl: 15m
  refresh-token-ttl: 7d
  issuer: metricsX

cache:
  user-ttl: 30m
  sales-ttl: 10m
  booking-ttl: 10m
  customer-ttl: 10m
  realtime-ttl: 70s
  ttl:
    station-detail: 1800s
    metro-station-scan: 1800s
    collection-user-stamps: 600s
    collection-user-progress: 600s
    collection-user-history: 900s
    collection-stamp-book: 900s

collection:
  idempotency-window: 1h
  max-page-size: 50
  default-page-size: 20
  stamp-collected-event-dedup-ttl: 48h
  gps:
    verification-enabled: true
    max-distance-meters: 150
    earth-radius-meters: 6371000

reward:
  default-page-size: 20
  max-page-size: 50
  user-reward-cache-ttl: 30m
  stamp-collected-event-dedup-ttl: 48h
  stamp-collected-event-processing-lock-ttl: 2m
  stamp-collected-event-max-attempts: 3
  stamp-collected-event-retry-backoff: 200ms
  expiry-cron: "0 0 2 * * *"

community:
  default-page-size: 20
  max-page-size: 50
  max-metadata-bytes: 2048
  referral-code-max-attempts: 5

# Mobile client update / maintenance policy (not installed binary version).
mobile:
  app-config:
    android:
      minimum-supported-version: ${MOBILE_ANDROID_MIN_VERSION:0.1.0}
      latest-version: ${MOBILE_ANDROID_LATEST_VERSION:0.1.0}
      force-update: ${MOBILE_ANDROID_FORCE_UPDATE:false}
      store-url: ${MOBILE_ANDROID_STORE_URL:}
    ios:
      minimum-supported-version: ${MOBILE_IOS_MIN_VERSION:0.1.0}
      latest-version: ${MOBILE_IOS_LATEST_VERSION:0.1.0}
      force-update: ${MOBILE_IOS_FORCE_UPDATE:false}
      store-url: ${MOBILE_IOS_STORE_URL:}
    maintenance:
      enabled: ${MOBILE_MAINTENANCE_ENABLED:false}
      message: ${MOBILE_MAINTENANCE_MESSAGE:}

storage:
  provider: ${STORAGE_PROVIDER:local}
  local:
    base-path: ${STORAGE_LOCAL_PATH:D:/Part-time/ExoticStamp/backend/uploads}
    base-url: ${STORAGE_LOCAL_URL:http://localhost:8080/uploads}
  file:
    max-size-mb: ${STORAGE_FILE_MAX_SIZE_MB:5}
    allowed-types:
      - image/jpeg
      - image/png
      - image/webp

logging:
  level:
    org.springframework.security: INFO
    org.springframework.web: INFO
