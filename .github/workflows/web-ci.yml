name: Web CI

on:
  pull_request:
    branches:
      - main
      - master
    paths:
      - 'web/**'
      - '.github/workflows/web-ci.yml'
  push:
    branches:
      - main
      - master
      - 'chore/**'
      - 'release/**'
      - 'hotfix/**'
    paths:
      - 'web/**'
      - '.github/workflows/web-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        env:
          VITE_API_BASE_URL: https://api.staging.example.com
          VITE_APP_ENV: staging
          VITE_APP_VERSION: ci
          VITE_BUILD_DATE: 2026-07-25
        run: npm run build

      - name: Upload web dist
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist/
          if-no-files-found: error
