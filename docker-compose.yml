services:
  postgres:
    image: postgres:16
    container_name: exotic-stamp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: exotic_stamp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: f123
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d exotic_stamp"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: exotic-stamp-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
    container_name: exotic-stamp-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:postgresql://postgres:5432/exotic_stamp
      DB_USERNAME: postgres
      DB_PASSWORD: f123
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: local-dev-jwt-secret-must-be-at-least-256-bits-long
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-noreply@exoticstamp.local}
      ADMIN_SEED_PASSWORD: ${ADMIN_SEED_PASSWORD:-changeme-dev-only}
    ports:
      - "8080:8080"

volumes:
  postgres_data:
